<!DOCTYPE html>
<html>
<head>
    <title>Prelim Grade Calculator</title>
    <style>
        /* --- Global Styles --- */
        body {
            font-family: "Segoe UI", sans-serif;
            background-color: #1e1e2f;
            color: #dfe6e9;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        /* --- Container --- */
        .container {
            width: 420px;
        }

        /* --- Panels --- */
        .panel {
            background-color: #2c2f4a;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            margin-bottom: 15px;
        }

        /* --- Titles --- */
        h2 {
            text-align: center;
            color: #a4c3f5;
            margin-bottom: 20px;
        }

        h3 {
            margin: 0 0 12px 0;
            color: #8ab4f8;
            font-size: 16px;
        }

        /* --- Table --- */
        table {
            width: 100%;
            text-align: center;
            border-collapse: collapse;
        }

        table th, table td {
            padding: 6px;
        }

        table th {
            color: #8ab4f8;
            font-weight: normal;
        }

        input[type="radio"] {
            accent-color: #3498db; /* soft blue check */
        }

        /* --- Lab Inputs --- */
        .lab-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        input[type="number"] {
            width: 60px;
            padding: 4px;
            border-radius: 6px;
            border: 1px solid #57606f;
            background-color: #1f2238;
            color: #dfe6e9;
        }

        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        label {
            color: #dfe6e9;
        }

        /* --- Button --- */
        button {
            background-color: #4a90e2;
            color: white;
            font-weight: bold;
            padding: 8px 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #357abd;
        }

        /* --- Result Panel --- */
        pre {
            margin: 0;
            white-space: pre-wrap;
            color: #dfe6e9;
        }
    </style>
</head>
<body>
<div class="container">

    <!-- Title -->
    <h2>Prelim Grade Calculator</h2>

    <!-- Attendance Panel -->
    <div class="panel">
        <h3>Attendance (Weeks 1–5)</h3>
        <table border="0">
            <tr>
                <th>Week</th>
                <th>P</th>
                <th>E</th>
                <th>A</th>
            </tr>
            <script>
                for (let w = 1; w <= 5; w++) {
                    document.write('<tr><td>Week ' + w + '</td>');
                    document.write('<td><input type="radio" name="week' + w + '" value="P" checked></td>');
                    document.write('<td><input type="radio" name="week' + w + '" value="E"></td>');
                    document.write('<td><input type="radio" name="week' + w + '" value="A"></td></tr>');
                }
            </script>
        </table>
    </div>

    <!-- Lab Work Panel -->
    <div class="panel">
        <h3>Lab Work Grades</h3>
        <div class="lab-row">
            <label>Lab 1:</label><input type="number" id="lab1" min="0" max="100">
        </div>
        <div class="lab-row">
            <label>Lab 2:</label><input type="number" id="lab2" min="0" max="100">
        </div>
        <div class="lab-row">
            <label>Lab 3:</label><input type="number" id="lab3" min="0" max="100">
        </div>
    </div>

    <!-- Button -->
    <div style="text-align:center; margin-bottom:15px;">
        <button onclick="calculateGrades()">Calculate Grades</button>
    </div>

    <!-- Result Panel -->
    <div class="panel">
        <pre id="result"></pre>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
