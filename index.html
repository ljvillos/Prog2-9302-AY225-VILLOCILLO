<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Attendance Monitoring System</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(
                135deg,
                #e7eff8,
                #f2f6fb
            );
        }

        .card {
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(8px);
            padding: 38px 42px;
            width: 380px;
            border-radius: 18px;

            /* Soft blue border */
            border: 2px solid #cfdff7;

            box-shadow:
                0 18px 35px rgba(0, 0, 0, 0.08),
                0 6px 12px rgba(0, 0, 0, 0.05);
        }

        h1 {
            text-align: center;
            margin-bottom: 6px;
            color: #2c3e50;
            font-size: 22px;
        } 

        .subtitle {
            text-align: center;
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 22px;
        }

        .instructions {
            font-size: 13px;
            color: #4b5563;
            background: #f9fafb;
            border-left: 4px solid #5b9bd5;
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #6b7280;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 10px;
            border: 1px solid #d1d5db;
            font-size: 15px;
            background: #f9fafb;
        }

        input:focus {
            outline: none;
            border-color: #5b9bd5;
            box-shadow: 0 0 0 3px rgba(91, 155, 213, 0.15);
            background: #ffffff;
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #5b9bd5, #4a8ac4);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
        }

        button:hover {
            box-shadow: 0 8px 15px rgba(91, 155, 213, 0.3);
        }

        #message {
            margin-top: 18px;
            text-align: center;
            font-weight: 500;
            min-height: 20px;
        }

        #timestamp {
            text-align: center;
            margin-top: 10px;
            color: #4b5563;
            font-size: 14px;
        }

        #downloadBtn {
            display: none;
            margin-top: 18px;
            background: linear-gradient(135deg, #2ecc71, #27ae60);
        }

        #downloadBtn:hover {
            box-shadow: 0 8px 15px rgba(39, 174, 96, 0.3);
        }

        @media (max-width: 420px) {
            .card {
                width: 90%;
                padding: 32px;
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Attendance Monitoring System</h1>
        <p class="subtitle">Welcome! Please log in to record your attendance.</p>

        <div class="instructions">
            Enter your assigned username and password below.  
            A successful login will automatically mark your attendance with the current date and time.
        </div>

        <form id="loginForm">
            <label for="username">Username</label>
            <input type="text" id="username" required>

            <label for="password">Password</label>
            <input type="password" id="password" required>

            <button type="submit">Log In</button>
        </form>

        <p id="message"></p>
        <p id="timestamp"></p>

        <button id="downloadBtn">Download Attendance Summary</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
